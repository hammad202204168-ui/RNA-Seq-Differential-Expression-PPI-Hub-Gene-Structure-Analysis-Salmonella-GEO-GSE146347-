name: pipeline
on:
  push:
    branches: [main]
  pull_request:
jobs:
  real-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/prepare_geo_tpm.py && python scripts/real_data_analysis.py && pytest -q
  demo-30gene:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/demo_30gene
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: examples/demo_30gene/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python scripts/rna_seq_pipeline.py && python scripts/simulate_alignments.py && python scripts/plot_alignments.py && pytest -q
